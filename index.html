<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUJAS Games Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--red2:#9e0c24;--ink:#1d1a1a;--muted:#7a6f6c;--bg:#fbf6f0;--card:#fff;--line:#eadfd6;--gold:#e0a400;--green:#1a8a4a;--sakura:#f7d6dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:720px;margin:0 auto;padding:12px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.brand{font-weight:800;font-size:20px;line-height:1.1}
.brand b{color:var(--red)}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:500}
nav{display:flex;gap:4px}
nav a{padding:7px 11px;border-radius:99px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
nav a.on{background:var(--red);color:#fff}
.demo{background:#fff4c2;border:1px solid #f0d870;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.hint{color:var(--muted);font-size:14px;margin:4px 2px 10px}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:4px 0 10px;font-size:16px}
.search:focus{outline:none;border-color:var(--red)}
.board{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:left}
.row.me{border-color:var(--red);background:#fff1f3}
.rk{width:34px;font-weight:800;color:var(--muted);text-align:center;font-size:15px}
.nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.cn small{font-size:13px;margin-left:3px}
.mecard{background:var(--red);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.mecard .top{display:flex;justify-content:space-between;align-items:baseline}
.mecard .big{font-size:42px;font-weight:800;line-height:1}
.mecard .sub{opacity:.85;font-size:14px}
.mecard ul{list-style:none;padding:0;margin:10px 0 0;font-size:13px;opacity:.95}
.mecard li{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(255,255,255,.2)}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:end;gap:8px;margin:6px 0 16px;text-align:center}
.podium .p{background:#fff;border:1.5px solid var(--line);border-radius:14px 14px 4px 4px;padding:10px 6px}
.podium .p1{background:var(--gold);color:#fff;border-color:var(--gold);padding-top:18px}
.podium .p .m{font-size:26px}
.podium .p .n{font-weight:800;word-break:break-word}
.podium .p .c{font-size:13px}
.winner-title{text-align:center;font-weight:800;color:var(--red);font-size:22px;margin-top:6px}
details.rules{margin-top:18px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
details.rules summary{font-weight:800;cursor:pointer}
details.rules h4{margin:12px 0 2px;color:var(--red)}
details.rules p{margin:2px 0;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:30px}
/* host */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px}
.panel h2{margin:0 0 2px;font-size:20px}
.panel .jp{color:var(--muted);font-size:13px;margin-bottom:10px}
.pill{display:inline-block;background:var(--sakura);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;margin:0 4px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow-y:auto;padding:2px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px}
.chip small{color:var(--muted);font-weight:500}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on small{color:#ffd9df}
.chip.low{border-style:dashed}
.btn{border:0;background:var(--red);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.small{padding:7px 11px;font-size:14px;border-radius:9px}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bar .btn{flex:1}
.sel{font-size:14px;margin:10px 0 0;color:var(--muted)}
.sel b{color:var(--ink)}
.entrants{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ent{position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:16px 8px;font-weight:800;font-size:16px}
.ent.on{border-color:var(--red);background:#fff1f3}
.ent .pl{position:absolute;top:-9px;left:-6px;background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:2px 8px}
.warn{background:#fff4c2;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:10px}
.ended{background:var(--ink);color:#fff;border-radius:12px;padding:12px;margin-bottom:10px;font-weight:700}
.field{display:flex;gap:8px;margin:8px 0}
.field input,textarea,.minput{flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff;width:100%}
textarea{min-height:110px}
.plist .pr{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.plist .pr .nm{flex:1}
.loge{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.loge .t{color:var(--muted);font-size:12px}
.loge.undone{opacity:.45;text-decoration:line-through}
.loge .d{margin-top:2px}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.stat{font-size:28px;font-weight:800}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,10,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.mbox h3{margin:0 0 8px}
.mbox table{width:100%;border-collapse:collapse;font-size:15px}
.mbox td{padding:5px 0;border-bottom:1px solid var(--line)}
.mbox td:last-child{text-align:right}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
/* tv */
body.tv #app{max-width:none;padding:24px 36px}
.tvwrap{display:grid;grid-template-columns:1fr 300px;gap:36px}
.tvwrap h1{font-size:44px;margin:0 0 14px}
.tvlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tvlist .row{padding:14px 18px;font-size:24px}
.tvlist .cn{font-size:28px}
.tvlist .rk{width:50px;font-size:24px}
.tvside{text-align:center}
#qr{background:#fff;padding:14px;border-radius:14px;display:inline-block}
#qr img,#qr canvas{display:block}
.feed{text-align:left;margin-top:18px;font-size:15px}
.feed div{padding:7px 0;border-bottom:1px solid var(--line)}
body.tv .podium{font-size:24px}
body.tv .podium .p .m{font-size:44px}
@media (max-width:900px){.tvwrap{grid-template-columns:1fr}.tvlist{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
// ===== SETTINGS: edit these =====

// paste your Firebase web config here; leave null to run in demo mode
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAI90GveJYjH-LM_Y5qPRrfsuAa3dpdXaY",
  authDomain: "sujas-games.firebaseapp.com",
  databaseURL: "https://sujas-games-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sujas-games",
  storageBucket: "sujas-games.firebasestorage.app",
  messagingSenderId: "117739277596",
  appId: "1:117739277596:web:9ba06b60cdf30fe9d03ed9"
};

const START_COINS = 100;
// what happens when someone can't afford a fee: 'warn' | 'block' | 'allow'
const BROKE_POLICY = 'warn';

const STATIONS = [
  {id:'indian', name:'Indian Poker', jp:'インディアンポーカー', kind:'pot', fee:5,
   rules:['5 coins to play','Same number → rock paper scissors','Winner takes the whole pot']},
  {id:'poker', name:'Poker', jp:'ポーカー', kind:'bank',
   rules:['1 coin = 1 chip','Buy chips at the table, cash out when you leave']},
  {id:'mariokart', name:'Mario Kart', jp:'マリオカート', kind:'ranked', fee:15, max:8, payouts:[50,30,20,10,5,5],
   rules:["Harvey's Switch · 1 race each",'15 coins to play · 8 players','1st 50 · 2nd 30 · 3rd 20 · 4th 10 · 5th 5 · 6th 5']},
  {id:'smash', name:'Smash Bros', jp:'スマブラ', kind:'ranked', fee:20, max:6, payouts:[80,40],
   rules:["Kai's Switch · Battlefield · 6 players",'20 coins to play','1st 80 · 2nd 40']},
];

// ===== helpers =====
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
};
const fmtT = ts => new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const sgn = n => n > 0 ? `<span class="pos">+${n}</span>` : `<span class="neg">−${Math.abs(n)}</span>`;
const stationById = id => STATIONS.find(s => s.id === id);

function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  ks.slice(0, -1).forEach(k => { o[k] ??= {}; o = o[k]; });
  o[ks.at(-1)] = val;
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== data stores =====
const inc = n => ({__inc: n});

async function firebaseStore(cfg){
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp} = await import(B + 'firebase-app.js');
  const D = await import(B + 'firebase-database.js');
  const A = await import(B + 'firebase-auth.js');
  const app = initializeApp(cfg);
  const db = D.getDatabase(app), auth = A.getAuth(app);
  return {
    demo: false,
    onData(cb){
      const s = {players:{}, log:{}, settings:{}};
      D.onValue(D.ref(db, 'players'), x => { s.players = x.val() || {}; cb(s); });
      D.onValue(D.query(D.ref(db, 'log'), D.limitToLast(400)), x => { s.log = x.val() || {}; cb(s); });
      D.onValue(D.ref(db, 'settings'), x => { s.settings = x.val() || {}; cb(s); });
    },
    newId: path => D.push(D.ref(db, path)).key,
    async write(upd){
      // __inc values become atomic server-side increments
      const u = {};
      for (const [k, v] of Object.entries(upd)) u[k] = v && v.__inc !== undefined ? D.increment(v.__inc) : v;
      await D.update(D.ref(db), u);
    },
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? {email: u.email} : null)),
    signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    signOut: () => A.signOut(auth),
  };
}

function localStore(){
  // demo: data lives in this browser only, synced across tabs
  let data = LS.get('gn-demo', {players:{}, log:{}, settings:{}});
  let cbs = [], acbs = [];
  let bc; try{ bc = new BroadcastChannel('gn-demo'); }catch{}
  const emit = () => cbs.forEach(cb => cb({players: data.players || {}, log: data.log || {}, settings: data.settings || {}}));
  if (bc) bc.onmessage = () => { data = LS.get('gn-demo', data); emit(); };
  const save = () => { LS.set('gn-demo', data); bc?.postMessage(1); };
  return {
    demo: true,
    onData(cb){ cbs.push(cb); cb({players: data.players || {}, log: data.log || {}, settings: data.settings || {}}); },
    newId: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    async write(upd){
      for (const [path, v] of Object.entries(upd)){
        const ks = path.split('/'); let o = data;
        for (const k of ks.slice(0, -1)){ o[k] ??= {}; o = o[k]; }
        const last = ks.at(-1);
        if (v && v.__inc !== undefined) o[last] = (o[last] || 0) + v.__inc;
        else if (v === null) delete o[last];
        else o[last] = JSON.parse(JSON.stringify(v));
      }
      data.players ??= {}; data.log ??= {}; data.settings ??= {};
      save(); emit();
    },
    onAuth(cb){ acbs.push(cb); cb(LS.get('gn-demo-user', null)); },
    async signIn(e){ LS.set('gn-demo-user', {email: e || 'host'}); acbs.forEach(cb => cb({email: e || 'host'})); },
    async signOut(){ LS.set('gn-demo-user', null); acbs.forEach(cb => cb(null)); },
  };
}

// ===== state =====
let S = {players:{}, log:{}, settings:{}};
let store = null, user = null, loaded = false;
const blankSt = () => ({sel:[], order:[], step:'pick', q:''});
const ui = {
  me: LS.get('gn-me', null),
  search: '',
  tab: LS.get('gn-tab', 'indian'),
  st: LS.get('gn-st', null) || Object.fromEntries(STATIONS.map(s => [s.id, blankSt()])),
  pokerAmt: '', newName: '', bulk: '', loginErr: '',
};
STATIONS.forEach(s => ui.st[s.id] ??= blankSt());
const saveDraft = () => { LS.set('gn-st', ui.st); LS.set('gn-tab', ui.tab); };

function ranked(){
  const arr = Object.entries(S.players).map(([id, p]) => ({id, ...p}));
  arr.sort((a, b) => (b.coins - a.coins) || String(a.name).localeCompare(b.name));
  let r = 0, prev = null;
  arr.forEach((p, i) => { if (p.coins !== prev){ r = i + 1; prev = p.coins; } p.rank = r; });
  return arr;
}
const logList = () => Object.entries(S.log).map(([id, e]) => ({id, ...e})).sort((a, b) => b.ts - a.ts);
const pname = id => S.players[id]?.name || '(removed)';
const historyOf = pid => logList().filter(e => e.deltas && e.deltas[pid] != null);
const deltaText = d => Object.entries(d || {}).map(([pid, n]) => `${esc(pname(pid))} ${sgn(n)}`).join(', ');

// ===== actions that write =====
async function transact(station, label, deltas, extra = {}){
  const id = store.newId('log'), upd = {};
  for (const [pid, d] of Object.entries(deltas)) if (d) upd[`players/${pid}/coins`] = inc(d);
  upd[`log/${id}`] = {ts: Date.now(), station, label, deltas, by: user?.email || '', ...extra};
  await store.write(upd);
}
async function safe(fn, okMsg){
  try{ await fn(); if (okMsg) toast(okMsg); }
  catch(err){ console.error(err); toast('Failed: ' + (err.code || err.message)); }
}

// ===== modal =====
let modalOk = null;
function openModal(html, onOk, okLabel = 'Confirm', okDisabled = false){
  modalOk = onOk;
  $modal.innerHTML = `<div class="mbox">${html}<div class="bar">
    <button class="btn ghost" data-act="mclose">${onOk ? 'Cancel' : 'Close'}</button>
    ${onOk ? `<button class="btn" data-act="mok" ${okDisabled ? 'disabled' : ''}>${okLabel}</button>` : ''}</div></div>`;
  $modal.classList.remove('hidden');
  $modal.querySelector('input')?.focus();
}
const closeModal = () => { $modal.classList.add('hidden'); $modal.innerHTML = ''; modalOk = null; };

// confirm a coin move, with broke warnings
function confirmDeltas(title, deltas, fee, onOk){
  const short = fee ? Object.keys(deltas).filter(pid => (S.players[pid]?.coins ?? 0) < fee) : [];
  const rows = Object.entries(deltas).map(([pid, n]) =>
    `<tr><td>${esc(pname(pid))} <small style="color:var(--muted)">(${S.players[pid]?.coins ?? 0} → ${(S.players[pid]?.coins ?? 0) + n})</small></td><td>${sgn(n)}</td></tr>`).join('');
  let warn = '';
  if (short.length && BROKE_POLICY !== 'allow')
    warn = `<div class="warn">⚠ Not enough coins: ${short.map(p => `${esc(pname(p))} (${S.players[p].coins})`).join(', ')}${BROKE_POLICY === 'block' ? '. They can’t join this game.' : ''}</div>`;
  openModal(`<h3>${esc(title)}</h3><table>${rows}</table>${warn}`, onOk, 'Confirm', short.length && BROKE_POLICY === 'block');
}

// ===== views =====
function header(active){
  const a = (h, l) => `<a href="#${h}" class="${active === h ? 'on' : ''}">${l}</a>`;
  return `<header><div class="brand">SUJAS <b>Games Night</b><span>ゲームナイト・コイン</span></div>
    <nav>${a('', 'Board')}${a('tv', 'TV')}${a('host', 'Host')}</nav></header>
    ${store?.demo ? '<div class="demo"><b>Demo mode.</b> Data is only saved in this browser. Add your Firebase config to share it live.</div>' : ''}`;
}
const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;
const row = p => `<button class="row ${p.id === ui.me ? 'me' : ''}" data-act="player" data-arg="${p.id}">
  <span class="rk">${medal(p.rank)}</span><span class="nm">${esc(p.name)}</span><span class="cn">${p.coins}<small>🪙</small></span></button>`;

function podium(list){
  const top = list.slice(0, 3);
  if (!top.length) return '';
  const cell = (p, cls, m) => p ? `<div class="p ${cls}"><div class="m">${m}</div><div class="n">${esc(p.name)}</div><div class="c">${p.coins} coins</div></div>` : '<div></div>';
  return `<div class="winner-title">🏆 Winner 優勝: ${esc(top[0].name)}</div>
    <div class="podium">${cell(top[1], 'p2', '🥈')}${cell(top[0], 'p1', '🥇')}${cell(top[2], 'p3', '🥉')}</div>`;
}

function rulesCard(){
  return `<details class="rules"><summary>Station rules ・ ルール</summary>
    <p>Everyone starts with ${START_COINS} coins. Most coins at the end wins.</p>
    ${STATIONS.map(s => `<h4>${s.name} <small>${s.jp}</small></h4>${s.rules.map(r => `<p>${esc(r)}</p>`).join('')}`).join('')}</details>`;
}

function viewBoard(){
  const list = ranked();
  const me = list.find(p => p.id === ui.me);
  const q = ui.search.trim().toLowerCase();
  const shown = q ? list.filter(p => String(p.name).toLowerCase().includes(q)) : list;
  let meHtml = `<div class="hint">Tap your name to follow your coins ・ 自分の名前をタップしてね</div>`;
  if (me){
    const h = historyOf(me.id).filter(e => !e.undone).slice(0, 4);
    meHtml = `<div class="mecard"><div class="top"><div><div class="sub">${esc(me.name)}</div><div class="big">${me.coins} 🪙</div></div>
      <div style="text-align:right"><div class="big" style="font-size:30px">#${me.rank}</div><div class="sub">of ${list.length}</div></div></div>
      ${h.length ? `<ul>${h.map(e => `<li><span>${esc(e.label)}</span><b>${e.deltas[me.id] > 0 ? '+' : ''}${e.deltas[me.id]}</b></li>`).join('')}</ul>` : ''}</div>`;
  }
  return `${header('')}${S.settings.ended ? podium(list) : ''}${meHtml}
    <input id="search" class="search" data-bind="search" data-live placeholder="Search name ・ 名前検索" value="${esc(ui.search)}" autocomplete="off">
    <div class="board">${shown.map(row).join('') || `<div class="empty">${loaded ? 'No players yet' : 'Loading…'}</div>`}</div>
    ${rulesCard()}`;
}

function viewTV(){
  const list = ranked();
  const feed = logList().filter(e => !e.undone && e.station !== 'adjust').slice(0, 7);
  return `<div class="tvwrap"><div>${S.settings.ended ? podium(list) : ''}
    <h1>Leaderboard <span style="color:var(--red)">ランキング</span></h1>
    <div class="tvlist">${list.slice(0, 16).map(row).join('') || '<div class="empty">Waiting for players…</div>'}</div></div>
    <aside class="tvside"><div id="qr"></div><p><b>Scan to check your coins</b><br>スキャンしてコインを確認</p>
    <div class="feed"><b>Latest</b>${feed.map(e => `<div>${esc(e.label)}</div>`).join('')}</div>
    <p style="margin-top:20px"><a href="#" style="color:var(--muted)">exit TV</a></p></aside></div>`;
}

function viewHost(){
  if (!store) return header('host') + '<div class="empty">Connecting…</div>';
  if (!user) return `${header('host')}<div class="panel"><h2>Host login</h2><div class="jp">Station hosts only</div>
    <form id="login"><div class="field"><input id="lemail" type="email" placeholder="Email" autocomplete="username"></div>
    <div class="field"><input id="lpw" type="password" placeholder="Password" autocomplete="current-password"></div>
    ${ui.loginErr ? `<div class="warn">${esc(ui.loginErr)}</div>` : ''}
    ${store.demo ? '<div class="hint">Demo: any email and password work.</div>' : ''}
    <div class="bar"><button class="btn" type="submit">Log in</button></div></form></div>`;
  const tabs = [...STATIONS.map(s => [s.id, s.name]), ['players', 'Players'], ['log', 'Log / Undo'], ['end', 'End game']];
  let body;
  const s = stationById(ui.tab);
  if (s && S.settings.ended) body = `<div class="ended">The game has ended. To keep playing, reopen it in the End game tab.</div>`;
  else if (s?.kind === 'pot') body = viewPot(s);
  else if (s?.kind === 'ranked') body = viewRanked(s);
  else if (s?.kind === 'bank') body = viewBank(s);
  else if (ui.tab === 'players') body = viewPlayers();
  else if (ui.tab === 'log') body = viewLog();
  else body = viewEnd();
  return `${header('host')}<div class="tabs">${tabs.map(([id, l]) => `<button class="${ui.tab === id ? 'on' : ''}" data-act="tab" data-arg="${id}">${l}</button>`).join('')}</div>
    <div class="panel">${body}</div>
    <p class="hint" style="margin-top:14px">Logged in as ${esc(user.email)} · <a href="#host" data-act="logout">log out</a></p>`;
}

function picker(s, max){
  const st = ui.st[s.id], q = st.q.toLowerCase();
  const ps = Object.entries(S.players).map(([id, p]) => ({id, ...p}))
    .sort((a, b) => String(a.name).localeCompare(b.name))
    .filter(p => !q || String(p.name).toLowerCase().includes(q) || st.sel.includes(p.id));
  return `<input id="q-${s.id}" class="search" data-bind="st.${s.id}.q" data-live placeholder="Search players" value="${esc(st.q)}" autocomplete="off">
    <div class="chips">${ps.map(p => `<button class="chip ${st.sel.includes(p.id) ? 'on' : ''} ${s.fee && p.coins < s.fee ? 'low' : ''}" data-act="toggle" data-arg="${s.id}|${p.id}|${max}">${esc(p.name)} <small>${p.coins}</small></button>`).join('') || '<span class="hint">No players. Add them in the Players tab.</span>'}</div>`;
}
const head = s => `<h2>${s.name}</h2><div class="jp">${s.jp}</div>${s.rules.map(r => `<span class="pill">${esc(r)}</span>`).join('')}`;

function viewPot(s){
  const st = ui.st[s.id], n = st.sel.length, pot = n * s.fee;
  if (st.step === 'pick') return `${head(s)}<p class="sel">1. Pick who is playing</p>${picker(s, 99)}
    <p class="sel">Playing: <b>${n}</b> · Pot: <b>${pot}</b> coins</p>
    <div class="bar"><button class="btn ghost" data-act="clear" data-arg="${s.id}">Clear</button>
    <button class="btn" data-act="step" data-arg="${s.id}|result" ${n < 2 ? 'disabled' : ''}>Next: pick winner →</button></div>`;
  return `${head(s)}<p class="sel">2. Tap the winner. Pot: <b>${pot}</b> coins</p>
    <div class="entrants">${st.sel.map(pid => `<button class="ent" data-act="potwin" data-arg="${s.id}|${pid}">${esc(pname(pid))}</button>`).join('')}</div>
    <div class="bar"><button class="btn ghost" data-act="step" data-arg="${s.id}|pick">← Back</button></div>`;
}

function viewRanked(s){
  const st = ui.st[s.id], n = st.sel.length, pot = n * s.fee;
  const paid = Math.min(n, s.payouts.length);
  const out = s.payouts.slice(0, paid).reduce((a, b) => a + b, 0);
  if (st.step === 'pick') return `${head(s)}<p class="sel">1. Pick players (max ${s.max})</p>${picker(s, s.max)}
    <p class="sel">Playing: <b>${n}/${s.max}</b> · Entry total: <b>${pot}</b> · Payouts: <b>${out}</b></p>
    ${n && n < s.max && out !== pot ? `<div class="warn">With ${n} players the payouts (${out}) don’t match the entry fees (${pot}).</div>` : ''}
    <div class="bar"><button class="btn ghost" data-act="clear" data-arg="${s.id}">Clear</button>
    <button class="btn" data-act="step" data-arg="${s.id}|result" ${n < 2 ? 'disabled' : ''}>Race done: enter results →</button></div>`;
  const ord = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
  return `${head(s)}<p class="sel">2. Tap players in finishing order (top ${paid} get paid)</p>
    <div class="entrants">${st.sel.map(pid => { const i = st.order.indexOf(pid);
      return `<button class="ent ${i >= 0 ? 'on' : ''}" data-act="place" data-arg="${s.id}|${pid}">${i >= 0 ? `<span class="pl">${ord[i]} +${s.payouts[i]}</span>` : ''}${esc(pname(pid))}</button>`; }).join('')}</div>
    <div class="bar"><button class="btn ghost" data-act="step" data-arg="${s.id}|pick">← Back</button>
    <button class="btn ghost" data-act="resetorder" data-arg="${s.id}">Reset order</button>
    <button class="btn" data-act="rankok" data-arg="${s.id}" ${st.order.length !== paid ? 'disabled' : ''}>Confirm results</button></div>`;
}

function viewBank(s){
  const st = ui.st[s.id];
  let table = 0;
  logList().filter(e => e.station === s.id && !e.undone).forEach(e => Object.values(e.deltas || {}).forEach(d => table -= d));
  const pid = st.sel[0], amt = parseInt(ui.pokerAmt, 10);
  const ok = pid && amt > 0;
  const recent = logList().filter(e => e.station === s.id).slice(0, 8);
  return `${head(s)}<p class="sel">Chips currently on the table: <b>${table}</b></p>
    <p class="sel">1. Pick a player</p>${picker(s, 1)}
    <p class="sel">2. Amount${pid ? ` for <b>${esc(pname(pid))}</b> (has ${S.players[pid]?.coins ?? 0} coins)` : ''}</p>
    <div class="field"><input id="pamt" type="number" inputmode="numeric" min="1" data-bind="pokerAmt" data-live value="${esc(ui.pokerAmt)}" placeholder="e.g. 30"></div>
    <div class="bar"><button class="btn" data-act="bank" data-arg="${s.id}|in" ${ok ? '' : 'disabled'}>Buy in (coins → chips)</button>
    <button class="btn dark" data-act="bank" data-arg="${s.id}|out" ${ok ? '' : 'disabled'}>Cash out (chips → coins)</button></div>
    ${recent.length ? `<p class="sel" style="margin-top:16px">Recent</p>${recent.map(logRow).join('')}` : ''}`;
}

function viewPlayers(){
  const list = ranked().sort((a, b) => String(a.name).localeCompare(b.name));
  return `<h2>Players</h2><div class="jp">${list.length} players · each starts with ${START_COINS}</div>
    <form id="addone"><div class="field"><input id="newname" data-bind="newName" value="${esc(ui.newName)}" placeholder="Name" autocomplete="off"><button class="btn small" type="submit">Add</button></div></form>
    <details><summary class="hint">Add many at once</summary><textarea id="bulk" data-bind="bulk" placeholder="One name per line">${esc(ui.bulk)}</textarea>
    <div class="bar"><button class="btn small" data-act="bulkadd">Add all</button></div></details>
    <div class="plist">${list.map(p => `<div class="pr"><span class="nm">${esc(p.name)}</span><b>${p.coins}</b>
      <button class="btn ghost small" data-act="adjust" data-arg="${p.id}">±</button>
      <button class="btn ghost small" data-act="rename" data-arg="${p.id}">✎</button>
      <button class="btn ghost small" data-act="delete" data-arg="${p.id}">✕</button></div>`).join('')}</div>`;
}

function logRow(e){
  const st = stationById(e.station);
  return `<div class="loge ${e.undone ? 'undone' : ''}"><div class="t">${fmtT(e.ts)} · ${st ? st.name : e.station}${e.by ? ' · ' + esc(e.by) : ''}</div>
    <div><b>${esc(e.label)}</b></div><div class="d">${deltaText(e.deltas)}</div>
    ${!e.undone && e.deltas && Object.keys(e.deltas).length ? `<button class="btn ghost small" style="margin-top:5px" data-act="undo" data-arg="${e.id}">Undo</button>` : ''}</div>`;
}
const viewLog = () => `<h2>Log</h2><div class="jp">Every coin move. Undo fixes mistakes.</div>${logList().slice(0, 150).map(logRow).join('') || '<div class="empty">Nothing yet</div>'}`;

function viewEnd(){
  const list = ranked(), total = list.reduce((a, p) => a + (p.coins || 0), 0);
  return `<h2>End game</h2><div class="jp">終了・優勝発表</div>
    <p class="sel">Players: <b>${list.length}</b> · Coins in play: <b>${total}</b>${list[0] ? ` · Leader: <b>${esc(list[0].name)}</b> (${list[0].coins})` : ''}</p>
    <div class="bar">${S.settings.ended
      ? '<button class="btn dark" data-act="reopen">Reopen game</button>'
      : '<button class="btn" data-act="endgame">End game & reveal winner 🏆</button>'}</div>
    <p class="hint" style="margin-top:24px">Ending the game freezes all stations and shows the podium to everyone.</p>
    <div class="bar" style="margin-top:30px"><button class="btn ghost" data-act="wipe">Wipe all data (after a test run)</button></div>`;
}

// ===== render =====
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
function render(){
  // keep focus and cursor while live data re-renders
  const a = document.activeElement, fid = $app.contains(a) ? a.id : null;
  let ss = null, se = null; try{ ss = a.selectionStart; se = a.selectionEnd; }catch{}
  const r = location.hash.slice(1);
  document.body.classList.toggle('tv', r === 'tv');
  $app.innerHTML = r === 'tv' ? viewTV() : r === 'host' ? viewHost() : viewBoard();
  if (r === 'tv') drawQR();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); try{ el.setSelectionRange(ss, se); }catch{} } }
}
function drawQR(){
  const el = document.getElementById('qr');
  if (!el) return;
  if (!window.QRCode){ el.style.display = 'none'; return; }
  new window.QRCode(el, {text: location.href.split('#')[0], width: 240, height: 240});
}

// ===== event handling =====
const ACT = {
  mclose: closeModal,
  async mok(){ const fn = modalOk; if (!fn) return; const keep = await fn(); if (keep !== true) closeModal(); },
  player(id){
    const p = S.players[id]; if (!p) return;
    const h = historyOf(id);
    const isMe = ui.me === id;
    openModal(`<h3>${esc(p.name)} · ${p.coins} 🪙</h3>
      ${h.length ? `<table>${h.slice(0, 30).map(e => `<tr style="${e.undone ? 'opacity:.4;text-decoration:line-through' : ''}"><td>${esc(e.label)}<br><small style="color:var(--muted)">${fmtT(e.ts)}</small></td><td>${sgn(e.deltas[id])}</td></tr>`).join('')}</table>` : '<p class="hint">No games yet</p>'}`,
      () => { ui.me = isMe ? null : id; LS.set('gn-me', ui.me); schedule(); }, isMe ? 'Not me' : '★ This is me');
  },
  tab(id){ ui.tab = id; saveDraft(); render(); },
  async logout(){ await store.signOut(); },
  toggle(arg){
    const [sid, pid, max] = arg.split('|'), st = ui.st[sid], m = +max;
    if (st.sel.includes(pid)) st.sel = st.sel.filter(x => x !== pid);
    else if (m === 1) st.sel = [pid];
    else if (st.sel.length < m) st.sel.push(pid);
    else toast(`Max ${m} players`);
    st.order = st.order.filter(x => st.sel.includes(x));
    saveDraft(); render();
  },
  clear(sid){ ui.st[sid] = blankSt(); saveDraft(); render(); },
  step(arg){ const [sid, step] = arg.split('|'); ui.st[sid].step = step; ui.st[sid].sel = ui.st[sid].sel.filter(p => S.players[p]); saveDraft(); render(); },
  resetorder(sid){ ui.st[sid].order = []; saveDraft(); render(); },
  potwin(arg){
    const [sid, win] = arg.split('|'), s = stationById(sid), st = ui.st[sid];
    const pot = st.sel.length * s.fee, deltas = {};
    st.sel.forEach(pid => deltas[pid] = -s.fee);
    deltas[win] += pot;
    confirmDeltas(`${pname(win)} wins the pot of ${pot}`, deltas, s.fee, () => safe(async () => {
      await transact(sid, `${s.name}: ${pname(win)} won the pot (${pot})`, deltas);
      ui.st[sid] = blankSt(); saveDraft(); schedule();
    }, 'Saved ✓'));
  },
  place(arg){
    const [sid, pid] = arg.split('|'), s = stationById(sid), st = ui.st[sid];
    const paid = Math.min(st.sel.length, s.payouts.length);
    if (st.order.includes(pid)) st.order = st.order.filter(x => x !== pid);
    else if (st.order.length < paid) st.order.push(pid);
    saveDraft(); render();
  },
  rankok(sid){
    const s = stationById(sid), st = ui.st[sid], deltas = {};
    st.sel.forEach(pid => deltas[pid] = -s.fee);
    st.order.forEach((pid, i) => deltas[pid] += s.payouts[i]);
    confirmDeltas(`${s.name} results`, deltas, s.fee, () => safe(async () => {
      await transact(sid, `${s.name}: 1st ${pname(st.order[0])}`, deltas, {order: st.order});
      ui.st[sid] = blankSt(); saveDraft(); schedule();
    }, 'Results saved ✓'));
  },
  bank(arg){
    const [sid, dir] = arg.split('|'), s = stationById(sid), pid = ui.st[sid].sel[0];
    const amt = parseInt(ui.pokerAmt, 10); if (!pid || !(amt > 0)) return;
    const d = dir === 'in' ? -amt : amt;
    confirmDeltas(`${s.name}: ${dir === 'in' ? 'buy in' : 'cash out'} ${amt}`, {[pid]: d}, dir === 'in' ? amt : 0, () => safe(async () => {
      await transact(sid, `${s.name}: ${pname(pid)} ${dir === 'in' ? 'bought in' : 'cashed out'} ${amt}`, {[pid]: d});
      ui.pokerAmt = ''; ui.st[sid] = blankSt(); saveDraft(); schedule();
    }, 'Saved ✓'));
  },
  bulkadd(){ addPlayers(ui.bulk.split('\n')); ui.bulk = ''; },
  adjust(pid){
    openModal(`<h3>Adjust ${esc(pname(pid))}</h3><p class="hint">Use a minus sign to take coins away.</p>
      <input class="minput" id="m-amt" type="number" inputmode="numeric" placeholder="e.g. 10 or -10" style="margin-bottom:8px">
      <input class="minput" id="m-why" placeholder="Reason (optional)">`, async () => {
      const n = parseInt(document.getElementById('m-amt').value, 10);
      const why = document.getElementById('m-why').value.trim();
      if (!n){ toast('Enter an amount'); return true; }
      await safe(() => transact('adjust', `Adjustment${why ? ': ' + why : ''}`, {[pid]: n}), 'Adjusted ✓');
    });
  },
  rename(pid){
    openModal(`<h3>Rename</h3><input class="minput" id="m-name" value="${esc(pname(pid))}">`, async () => {
      const n = document.getElementById('m-name').value.trim(); if (!n) return true;
      await safe(() => store.write({[`players/${pid}/name`]: n}), 'Renamed ✓');
    });
  },
  delete(pid){
    openModal(`<h3>Remove ${esc(pname(pid))}?</h3><p class="hint">Their coins go with them. Use this for duplicates or typos.</p>`,
      () => safe(() => store.write({[`players/${pid}`]: null}), 'Removed'), 'Remove');
  },
  undo(id){
    const e = S.log[id]; if (!e) return;
    const back = Object.fromEntries(Object.entries(e.deltas || {}).filter(([pid]) => S.players[pid]).map(([pid, d]) => [pid, -d]));
    confirmDeltas(`Undo: ${e.label}`, back, 0, () => safe(async () => {
      const upd = {[`log/${id}/undone`]: true};
      for (const [pid, d] of Object.entries(back)) upd[`players/${pid}/coins`] = inc(d);
      await store.write(upd);
    }, 'Undone ✓'));
  },
  endgame(){ openModal('<h3>End the game?</h3><p>All stations freeze and everyone sees the podium.</p>', () => safe(() => store.write({'settings/ended': true}), '🏆 Winner revealed'), 'End game'); },
  reopen(){ safe(() => store.write({'settings/ended': false}), 'Game reopened'); },
  wipe(){
    openModal('<h3>Wipe everything?</h3><p>Deletes all players and history. Type <b>RESET</b> to confirm.</p><input class="minput" id="m-reset">', async () => {
      if (document.getElementById('m-reset').value.trim() !== 'RESET'){ toast('Type RESET'); return true; }
      await safe(() => store.write({players: null, log: null, settings: null}), 'Wiped');
      ui.st = Object.fromEntries(STATIONS.map(s => [s.id, blankSt()])); saveDraft();
    }, 'Wipe');
  },
};

async function addPlayers(names){
  const existing = new Set(Object.values(S.players).map(p => String(p.name).toLowerCase()));
  const upd = {}, skipped = [];
  let added = 0;
  for (const raw of names){
    const n = raw.trim().slice(0, 39); if (!n) continue;
    if (existing.has(n.toLowerCase())){ skipped.push(n); continue; }
    existing.add(n.toLowerCase());
    upd[`players/${store.newId('players')}`] = {name: n, coins: START_COINS, created: Date.now()};
    added++;
  }
  if (added) await safe(() => store.write(upd));
  toast(`Added ${added}${skipped.length ? ` · already exists: ${skipped.join(', ')}` : ''}`);
  schedule();
}

const SUBMIT = {
  async login(){
    const e = document.getElementById('lemail').value.trim(), p = document.getElementById('lpw').value;
    try{ ui.loginErr = ''; await store.signIn(e, p); }
    catch(err){ ui.loginErr = 'Login failed: wrong email or password'; render(); }
  },
  addone(){ const n = ui.newName; ui.newName = ''; addPlayers([n]); document.getElementById('newname')?.focus(); },
};

document.addEventListener('click', e => {
  if (e.target === $modal){ closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el.dataset.arg, el); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.bind; if (!k) return;
  setPath(ui, k, e.target.value);
  if (k.startsWith('st.')) saveDraft();
  if ('live' in e.target.dataset) render();
});
document.addEventListener('submit', e => { e.preventDefault(); SUBMIT[e.target.id]?.(); });
window.addEventListener('hashchange', render);

// ===== start =====
render();
(async () => {
  try{ store = FIREBASE_CONFIG ? await firebaseStore(FIREBASE_CONFIG) : localStore(); }
  catch(err){ $app.innerHTML = `<div class="warn">Couldn’t connect to Firebase: ${esc(err.message)}</div>`; return; }
  store.onAuth(u => { user = u; schedule(); });
  store.onData(s => { S = s; loaded = true; schedule(); });
})();
</script>
</body>
</html>
